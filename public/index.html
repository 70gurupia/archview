<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Visual Server - Galeria</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #052e56;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: auto;
        }
        .card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #555;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
        }
        .mermaid {
            display: flex;
            justify-content: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Galeria de Diagramas Gerados</h1>
    <div class="container" id="gallery">
        <!-- Os diagramas aparecerão aqui -->
    </div>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'default',
            securityLevel: 'loose'
        });

        async function loadDiagrams() {
            try {
                const response = await fetch('/api/diagrams');
                const diagrams = await response.json();
                
                const gallery = document.getElementById('gallery');
                if (gallery) {
                  gallery.replaceChildren(); // limpa
                  
                  for (const diag of diagrams) {
                      const card = document.createElement('div');
                      card.className = 'card';
                      
                      const h2 = document.createElement('h2');
                      h2.textContent = diag.name || diag.title || 'Diagrama';
                      
                      const mmdDiv = document.createElement('div');
                      mmdDiv.className = 'mermaid';
                      mmdDiv.textContent = diag.content;
                      
                      card.appendChild(h2);
                      card.appendChild(mmdDiv);
                      gallery.appendChild(card);
                  }
                }
                
                // Pede para o Mermaid renderizar os novos blocos inseridos
                await mermaid.run({
                    querySelector: '.mermaid'
                });
            } catch (err) {
                console.error("Erro ao carregar diagramas", err);
            }
        }

        loadDiagrams();
        
        // Auto-refresh a cada 5 segundos para exibir em tempo real
        setInterval(loadDiagrams, 5000);
    </script>
</body>
</html>
