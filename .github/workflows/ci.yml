name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanliness-gate:
    name: Gate 0: Repository Cleanliness & Essential Files Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate No Temporary or Non-Essential Files Committed
        run: |
          echo "🔍 Verificando se apenas arquivos essenciais estão versionados no Git..."
          FORBIDDEN=$(git ls-files | grep -E '(\.docx$|\.xlsx$|\.pptx$|\.log$|\.tmp$|patch_.*\.py$|^build/|^output/.*(\.html|\.mmd|\.meta\.json)$|PROMPT.*\.md$|(^|/)test\.ts$|(^|/)test-v2\.ts$)' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "❌ ERRO NO GATE DE LIMPEZA: Arquivos não-essenciais ou temporários encontrados no Git:"
            echo "$FORBIDDEN"
            echo "💡 Regra de Governança: Apenas código-fonte, testes oficiais e documentações essenciais são permitidos."
            echo "💡 Remova esses arquivos do Git e garanta que estejam cobertos pelo .gitignore."
            exit 1
          fi
          echo "✅ Gate de Limpeza aprovado com sucesso! Repositório enxuto e sem ruído."

  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    needs: cleanliness-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (Root)
        run: npm ci

      - name: Install dependencies (Frontend)
        run: npm ci --prefix frontend

      - name: Compile Backend & Build Frontend
        run: npm run build

      - name: Run Full Test Suite (TDD, ODD, Pentest, SAST)
        run: npm test

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=critical || true
