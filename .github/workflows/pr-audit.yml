name: PR Quality Bot

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-quality-check:
    name: PR Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Gate: Verify No Non-Essential Files in PR
        run: |
          echo "🔍 Verificando se o PR contém apenas arquivos essenciais..."
          FORBIDDEN=$(git ls-files | grep -E '(\.docx$|\.xlsx$|\.pptx$|\.log$|\.tmp$|patch_.*\.py$|^build/|^output/.*(\.html|\.mmd|\.meta\.json)$|PROMPT.*\.md$|(^|/)test\.ts$|(^|/)test-v2\.ts$)' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "❌ ERRO NO GATE: Arquivos não-essenciais ou de rascunho detectados no PR:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "✅ Gate de Limpeza aprovado no PR."

      - name: Validate Conventional Commit / PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

      - name: Auto Label PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const labels = new Set();
            for (const file of files) {
              if (file.filename.startsWith('src/')) labels.add('backend');
              if (file.filename.startsWith('frontend/')) labels.add('frontend');
              if (file.filename.startsWith('docs/') || file.filename.endsWith('.md')) labels.add('documentation');
              if (file.filename.startsWith('tests/')) labels.add('testing');
              if (file.filename.startsWith('.github/')) labels.add('ci/cd');
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: Array.from(labels),
              });
            }
